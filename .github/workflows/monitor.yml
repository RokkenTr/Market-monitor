name: Market monitor

on:
  schedule:
    # Kept as a backup in case the external trigger (cron-job.org) ever
    # misses a beat — GitHub's own schedule timing isn't reliable enough
    # to rely on alone for 5-minute checks.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  repository_dispatch:
    types: [run-monitor]  # triggered externally by cron-job.org every 5 min

permissions:
  contents: write   # needed so the workflow can commit the updated state.json back

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update state [skip ci]"
          git push
